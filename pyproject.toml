[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autostart"
version = "0.1.0"
description = "Replay declared recovery steps after a reboot, without calling an AI agent."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "zlephir42069"}]
keywords = ["agents", "automation", "reboot", "recovery", "cron"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Boot",
]
dependencies = ["PyYAML>=5.4"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/zlephir42069/zlegbot-autostart"

[project.scripts]
autostart = "autostart.cli:main"

[tool.setuptools.packages.find]
include = ["autostart*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
filterwarnings = [
    "ignore:unclosed <socket\\.socket:ResourceWarning",
]
