# Portable steps for a fresh machine, including a GitHub-hosted runner.
# Paths are relative to this file. There is no notify block, so the run
# does not need a webhook secret. Add one that uses ${AUTOSTART_STATUS_URL}
# if you want a status line.
#
# Crontab and process steps are omitted on purpose. A runner is a new VM
# and cannot restore cron or daemons on a computer that is powered off.

log: .autostart/autostart.log
log_max_bytes: 1048576
log_backups: 3
stop_on_error: false

steps:
  - name: dirs
    type: ensure_dir
    paths:
      - ./data

  - name: note
    type: restore
    dest: ./data/note.txt
    backup: ./note.txt

  - name: note-hash
    type: checksum
    path: ./data/note.txt
    sha256: dc51b8c96c2d745df3bd5590d990230a482fd247123599548e0632fdbf97fc22

  - name: health
    type: command
    run: test -s ./data/note.txt
    timeout: 10
