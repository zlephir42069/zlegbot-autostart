# Copy to autostart.yaml and edit the paths and commands. Secrets stay in
# the environment: ${AUTOSTART_STATUS_URL}. Paths are relative to this file.
# ${NAME} is replaced when the config loads. Write $${NAME} when a shell
# command must see a literal ${NAME}. Quote crontab lines so YAML does not
# treat * as an alias.

log: .autostart/autostart.log
log_max_bytes: 1048576
log_backups: 3
stop_on_error: false

# Delete this block to skip the status post. type is discord, slack,
# webhook, or generic (generic is the same JSON post as webhook).
notify:
  type: discord
  url: ${AUTOSTART_STATUS_URL}
  timeout: 30
  retries: 3
  backoff: 0.5

steps:
  # Create directories that the rest of the recovery expects.
  - name: dirs
    type: ensure_dir
    paths:
      - ./data
      - ./run

  # Copy the backup only when the destination is missing.
  - name: note
    type: restore
    dest: ./data/note.txt
    backup: ./backup/note.txt

  # sha256 of the two bytes "ok" plus a newline. Replace with your file.
  - name: note-hash
    type: checksum
    path: ./data/note.txt
    sha256: dc51b8c96c2d745df3bd5590d990230a482fd247123599548e0632fdbf97fc22

  # Reinstall one marker-delimited block. Other crontab lines are left alone.
  # A second run with the same lines does not rewrite the crontab.
  - name: jobs
    type: crontab
    marker: jobs
    lines:
      - "15 * * * * /usr/local/bin/hourly-job"

  # Start the worker only when the pidfile is dead and pgrep finds nothing.
  # Either check is enough to count the process as running.
  - name: worker
    type: process
    pidfile: ./run/worker.pid
    match: autostart-worker
    start: ./bin/worker
    timeout: 10

  - name: ready
    type: command
    run: test -f ./data/note.txt
    timeout: 10
